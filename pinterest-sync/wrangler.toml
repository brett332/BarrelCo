# pinterest-sync — Pinterest boards -> Google Drive folders.
# Separate Worker from barrel-co; deployed via Cloudflare Workers Builds
# with root directory "pinterest-sync". keep_vars preserves dashboard secrets.
# No cron trigger, ever: the master scheduler (Apps Script, RidgeCo repo apps-script/hub-scheduler) calls this
# Worker's /boards and /sync weekly. The GitHub workflow is a manual button only.
name = "pinterest-sync"
main = "worker.js"
compatibility_date = "2026-06-08"
keep_vars = true
workers_dev = true

[[kv_namespaces]]
binding = "SEEN"
id = "ba52295039a6498bb84c29306259fd4e"
