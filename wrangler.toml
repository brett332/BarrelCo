# Cloudflare Worker deploy config for BarrelCo.
# Purpose: enable push-to-main auto-deploy via Cloudflare Workers Builds.
# keep_vars = true is CRITICAL — it preserves the env vars and secrets set in
# the Cloudflare dashboard (ANTHROPIC_API_KEY, SHEET_ID, SERVICE_ACCOUNT_EMAIL,
# SERVICE_ACCOUNT_KEY) so a deploy never wipes them.
#
# NOTE ON 1042: BarrelCo is a CALLEE of the cross-hub sync (BrettOS fetches
# /public/entities-feed from here), not a caller, so it originates no cross-Worker
# fetch and needs no code change. The 1042 fix lives in the brett-os Worker via
# Service Bindings. This file only wires auto-deploy.

name = "barrel-co"
main = "worker.js"
compatibility_date = "2026-06-08"
keep_vars = true
workers_dev = true

# Entry-sheet processor (entry.js) needs a cron trigger, e.g.:
#   [triggers]
#   crons = ["* * * * *"]
# Left OFF on purpose: the Cloudflare account is on the Workers Free plan, which allows
# only 5 cron triggers per account and they are all in use, so adding it makes every
# deploy end in "Trigger configuration partially updated" (code deploys, build shows failed).
# Re-add once the plan is upgraded or a trigger is freed (build #a8419ded, Oct 12 2026).

# Git auto-deploy connected via Cloudflare Workers Builds.
